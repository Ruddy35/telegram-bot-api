# Builds the Docker image on every push and publishes it to the GitHub Container Registry for the branch master and
# for tags v*: ghcr.io/<owner>/<repository>:latest, :<tag> and :sha-<commit>. See the section "Docker" in README.md.
name: Docker image

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - id: image
        name: Choose the image name and tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$image:sha-${GITHUB_SHA::7}"
          publish=false
          if [ "$GITHUB_REF" = "refs/heads/master" ]; then
            tags="$tags,$image:latest"
            publish=true
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags="$tags,$image:$GITHUB_REF_NAME"
            publish=true
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - if: steps.image.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # other branches are only built to check that the image can be built
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.image.outputs.publish == 'true' }}
          tags: ${{ steps.image.outputs.tags }}
